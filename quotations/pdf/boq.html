{% load l10n %}{% localize off %}
<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@page { size: 595.56pt 842.04pt; margin: 24pt 25pt 24pt 25pt; background: #e6e6e5; }
{% include "quotations/pdf/_base_css.html" %}
h1 { text-align: center; color: #2e75b6; font-size: 16pt; font-weight: 700; margin: 0 0 8pt 0; }
table.boq { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 7.2pt; line-height: 1.3; color: #111; }
table.boq th { background: #0070c0; color: #fff; font-weight: 300; font-size: 10pt; height: 28pt; border: 0.6pt solid #000; }
table.boq td { border: 0.6pt solid #000; padding: 1.5pt 3pt; vertical-align: top; }
table.boq tr { page-break-inside: avoid; }
table.boq thead { display: table-header-group; }
td.sr { width: 47pt; } td.part { width: 100pt; vertical-align: middle; } td.qty { width: 32pt; } td.make { width: 103pt; }
</style></head>
<body>
<h1>BOQ</h1>
<table class="boq">
  <thead><tr><th style="width:47pt">Sr.No</th><th style="width:100pt">Particular</th><th>Specification</th><th style="width:32pt">QTY</th><th style="width:103pt">MAKE</th></tr></thead>
  <tbody>
  {% for item in boq_items %}
    <tr>
      <td class="sr">{{ item.sr_no }}</td>
      <td class="part">{{ item.particular|linebreaksbr }}</td>
      <td>{{ item.specification|linebreaksbr }}</td>
      <td class="qty">{{ item.qty }}</td>
      <td class="make">{{ item.make }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5" style="text-align:center;padding:12pt;">No BOQ items</td></tr>
  {% endfor %}
  </tbody>
</table>
</body></html>
{% endlocalize %}
