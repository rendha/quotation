<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehlsen Energy - {{ title|default:"Daily report" }}</title>
    {% include "quotations/_pwa_head.html" %}
</head>
<body style="margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937">
<div style="background:#3B73B9;color:white;padding:22px"><h1 style="margin:0;font-size:22px">{{ title|default:"Daily report" }}</h1></div>
<div style="max-width:420px;margin:auto;padding:20px">
    <p><a href="{% url 'quotation_dashboard' %}" style="color:#3B73B9">&larr; Quotations</a></p>
    <form method="post" action="{% url 'unlock_rates' %}" style="background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
        {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
        <p style="margin-top:0">The {{ title_lower|default:"daily report" }} is for the admin only. Enter the admin passkey.</p>
        <input type="password" name="passkey" placeholder="Admin passkey" autocomplete="off" required style="padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;width:100%">
        <button type="submit" style="margin-top:12px;background:#3B73B9;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer">Open report</button>
        {% if error %}<div style="color:#b91c1c;margin-top:10px">{{ error }}</div>{% endif %}
    </form>
</div>
</body>
</html>
